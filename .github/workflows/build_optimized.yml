name: Optimized Compiled

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_BRANCH: "4.3-stable"

jobs:
  build-custom-template:
    name: Compile Lightweight Windows Template & Export
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Build Dependencies (MinGW, UPX)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mingw-w64 scons upx-ucl

      - name: Cache Godot Source & SCons Build
        uses: actions/cache@v4
        with:
          path: |
            godot-source
            ~/.scons_cache
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-${{ hashFiles('build_config/custom.py', 'build_profile.build') }}
          restore-keys: |
            ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-

      - name: Clone Godot Source
        run: |
          if [ ! -d "godot-source" ]; then
            git clone --depth 1 --branch ${{ env.GODOT_BRANCH }} https://github.com/godotengine/godot.git godot-source
          fi

      - name: Compile Custom Export Template
        run: |
          cd godot-source
          scons platform=windows target=template_release arch=x86_64 optimize=size lto=full use_static_cpp=yes debug_symbols=no disable_3d=yes build_profile=../build_profile.build profile=../build_config/custom.py -j$(nproc)
          
          # Strip symbols
          x86_64-w64-mingw32-strip bin/godot.windows.template_release.x86_64.exe
          
          # Copy to project templates
          mkdir -p ../templates
          cp bin/godot.windows.template_release.x86_64.exe ../templates/windows_release_x86_64.exe

      - name: Compress Template with UPX
        run: |
          upx --best --lzma templates/windows_release_x86_64.exe || true

      - name: Setup Headless Godot Editor for Export
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 godot-editor

      - name: Export Optimized Project
        run: |
          mkdir -p build/windows
          ./godot-editor --headless --export-release "Windows Desktop" build/windows/RiotSwitcher.exe

      - name: Display Binary Sizes
        run: |
          ls -lh build/windows/

      - name: Package Release ZIP
        run: |
          cd build/windows
          zip -9 -r ../../RiotSwitcher-Windows-Optimized.zip .
          cd ../..
          ls -lh RiotSwitcher-Windows-Optimized.zip

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiotSwitcher-Windows-Optimized
          path: RiotSwitcher-Windows-Optimized.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RiotSwitcher-Windows-Optimized.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
